<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D Romantic Heart</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- BỔ SUNG THREE/ADDONS ĐỂ KHÔNG BỊ SẬP CODE JS -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <!-- MÀN HÌNH KHÓA: CANVAS VẼ CHỮ HẠT CHUẨN UI NGANG -->
  <div id="rotate-lock-screen">
    <canvas id="lock-canvas"></canvas>
  </div>

  <!-- 1. Màn hình mở quà -->
  <div id="start-screen">
    <button id="start-btn">✨ Nhanh tay click cậu ơi ✨</button>
  </div>

  <!-- 2. Video Intro -->
  <div id="video-container" class="hidden">
    <video id="intro-video" muted playsinline webkit-playsinline preload="auto">
      <source src="./assets/intro.mp4" type="video/mp4">
    </video>
    <button id="skip-btn">Bỏ qua ⏭</button>
  </div>

  <!-- 3. Nhạc nền -->
  <audio id="music-clip" preload="auto">
    <source src="./assets/music1.mp3" type="audio/mpeg">
  </audio>

  <audio id="music-heart" loop preload="auto">
    <source src="./assets/music2.mp3" type="audio/mpeg">
  </audio>

  <!-- 4. Cụm nút điều khiển: Thêm nút Thoát 🚪 -->
  <div id="controls" class="hidden">
    <button id="toggle-music-btn" title="Bật/Tắt nhạc">🔊</button>
    <button id="toggle-anim-btn" title="Dừng/Tiếp tục">⏸️</button>
    <button id="exit-btn" title="Thoát chương trình">🚪</button>
  </div>

  <!-- 5. Màn hình tạm biệt khi thoát -->
  <div id="exit-screen" class="hidden">
    <div class="exit-box">
      <h2>Hẹn gặp lại cậu nhé! ❤️</h2>
      <p>Cảm ơn cậu đã ghé thăm và theo dõi ✨</p>
      <button id="replay-btn">Xem lại từ đầu 🔄</button>
    </div>
  </div>

  <!-- 6. Canvas 3D -->
  <canvas id="canvas"></canvas>

  <script type="module" src="js/main.js"></script>
</body>

</html>
