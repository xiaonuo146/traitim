<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D Romantic Heart</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
</head>

<body>
  <div id="rotate-lock-screen">
    <canvas id="lock-canvas"></canvas>
  </div>
  <!-- 1. Màn hình mở quà -->
  <div id="start-screen">
    <button id="start-btn">✨ Nhanh tay click cậu ơi ✨</button>
  </div>

  <!-- 2. Video Intro (Bổ sung webkit-playsinline cho iPhone) -->
  <div id="video-container" class="hidden">
    <video id="intro-video" muted playsinline webkit-playsinline preload="auto">
      <source src="./assets/intro.mp4" type="video/mp4">
    </video>
    <button id="skip-btn">Bỏ qua ⏭</button>
  </div>

  <!-- 3. Nhạc nền -->
  <audio id="music-clip" preload="auto">
    <source src="./assets/music1.mp3" type="audio/mpeg">
  </audio>

  <audio id="music-heart" loop preload="auto">
    <source src="./assets/music2.mp3" type="audio/mpeg">
  </audio>

  <!-- 4. Nút điều khiển -->
  <div id="controls" class="hidden">
    <button id="toggle-music-btn" title="Bật/Tắt nhạc">🔊</button>
    <button id="toggle-anim-btn" title="Dừng/Tiếp tục">⏸️</button>
  </div>

  <!-- 5. Canvas 3D -->
  <canvas id="canvas"></canvas>

  <script type="module" src="js/main.js"></script>
</body>



</html>
